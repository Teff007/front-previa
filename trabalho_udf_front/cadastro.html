<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - UDF na Cozinha</title>

    <link rel="stylesheet" href="estilos.css">
    <!-- O login.css também serve para o cadastro (mesmo cartão) -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login">
        <img src="imagens/Logo UDF-Na-Cozinha.png" alt="Logo UDF na Cozinha">

        <h1>Criar conta</h1>

        <p>Cadastre-se para começar a compartilhar suas receitas.</p>

        <!-- O botão "Criar conta" envia o formulário e abre a página de receitas -->
        <form id="form-cadastro" action="receitas.html">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>

            <label for="confirmar-senha">Confirmar senha:</label>
            <input type="password" id="confirmar-senha" placeholder="Digite sua senha novamente" autocomplete="new-password" required>

            <button type="submit" class="botao-principal">Criar conta</button>
        </form>

        <p>
            Já possui uma conta?
            <a href="login.html">Fazer login</a>
        </p>

    </main>

</body>
</html>
