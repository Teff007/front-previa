<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UDF na Cozinha</title>

    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login">
        <img src="imagens/Logo UDF-Na-Cozinha.png" alt="Logo UDF na Cozinha">

        <h1>UDF na Cozinha</h1>

        <p>Entre na sua conta para continuar.</p>

        <!-- O botão "Entrar" envia o formulário e abre a página de receitas -->
        <form id="form-login" action="receitas.html">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

            <button type="submit" class="botao-principal">Entrar</button>
        </form>

        <p>
            Ainda não possui uma conta?
            <a href="cadastro.html">Criar conta</a>
        </p>

    </main>

</body>
</html>
